<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 300px; font-family: Inter, sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; margin: 0; }
    h2 { font-size: 15px; margin: 0 0 6px; color: #f59e0b; }
    p { font-size: 12px; color: #94a3b8; margin: 0 0 12px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 12px; margin-bottom: 10px; }
    button { width: 100%; padding: 10px; border-radius: 8px; border: none; font-weight: 700; font-size: 12px; cursor: pointer; margin-bottom: 6px; }
    .start { background: #4f46e5; color: #fff; }
    .stop { background: #10b981; color: #0f172a; }
  </style>
</head>
<body>
  <h2>Arcade DOM Recorder (MV3)</h2>
  <p id="status">Ready to record interactive steps.</p>
  <input id="serverUrl" value="http://localhost:3000" placeholder="Arcade Studio Server URL" />
  <button id="startBtn" class="start">● Start Recording Tab</button>
  <button id="stopBtn" class="stop">■ Finish & Open in Studio</button>
  <script src="popup.js"></script>
</body>
</html>
